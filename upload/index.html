<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>IQ Labs Upload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap">
<style>
/* One centred card: case header, drop zone, per-file progress list. */
:root {
  --bg: #f4f4fa; --surface: #ffffff; --ink: #1b1d2b; --muted: #5d6079; --line: #e2e3ee;
  --accent: #4b45c6; --accent-tint: #ecebfb; --ok: #11795b; --err: #b3341f;
  --font: "Vazirmatn", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12131c; --surface: #1b1d29; --ink: #e8e8f2; --muted: #a3a6c0; --line: #2d3044;
          --accent: #a19dff; --accent-tint: #27254a; --ok: #5fd3a9; --err: #ff8a73; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font);
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.card { max-width: 560px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.lab { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
h1 { font-size: 22px; margin: 4px 0 2px; line-height: 1.3; }
.meta { color: var(--muted); font-size: 14.5px; }
.drop { display: block; margin-top: 18px; border: 2px dashed var(--line); border-radius: 12px; padding: 30px 16px; text-align: center; cursor: pointer; }
.drop.over, .drop:hover, .drop:focus-visible { border-color: var(--accent); background: var(--accent-tint); outline: none; }
.drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
.drop span { color: var(--muted); font-size: 13.5px; }
input[type=file] { display: none; }
ul { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; }
li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.row { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.name { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.state { font-size: 13px; color: var(--muted); white-space: nowrap; }
.state.ok { color: var(--ok); } .state.err { color: var(--err); }
.bar { height: 6px; background: var(--line); border-radius: 99px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.notice { text-align: center; padding: 30px 8px; color: var(--muted); }
.notice b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }
.foot { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 16px; }
button.retry { margin-top: 8px; font: 600 13px var(--font); color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="card" id="card"><div class="notice" id="loading">…</div></div>
<p class="foot">IQ Labs</p>

<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<script>
(function () {
  var FN = "https://efjeeeztckovmtuzvefp.supabase.co/functions/v1/case-upload";
  var TUS = "https://efjeeeztckovmtuzvefp.storage.supabase.co/storage/v1/upload/resumable/sign";
  var APIKEY = "sb_publishable_f-apqI_p1ob8DYGS2or2Ug_mfZFLTZV";

  var T = {
    en: { title: "Upload files to case", pick: "Tap to choose files", hint: "or drop them here · scans, zips, photos, videos · up to {mb} MB each",
          waiting: "Waiting…", uploading: "Uploading {p}%", saving: "Saving…", done: "Added ✓", failed: "Failed", retry: "Try again",
          tooBig: "Too big (max {mb} MB)", expired: "This link has expired", expiredHelp: "Send /upload to the bot to get a new link.",
          invalid: "This link is not valid", invalidHelp: "Send /upload to the bot to get a new link.", already: "Already added",
          until: "Link works until {t}", patient: "Patient", doctor: "Doctor" },
    ar: { title: "رفع ملفات إلى الحالة", pick: "اضغط لاختيار الملفات", hint: "أو أسقطها هنا · ملفات المسح، zip، صور، فيديو · حتى {mb} ميغابايت لكل ملف",
          waiting: "بالانتظار…", uploading: "جارٍ الرفع {p}%", saving: "جارٍ الحفظ…", done: "أُضيف ✓", failed: "فشل", retry: "إعادة المحاولة",
          tooBig: "كبير جداً (الحد {mb} ميغابايت)", expired: "انتهت صلاحية هذا الرابط", expiredHelp: "أرسل ‎/upload إلى البوت للحصول على رابط جديد.",
          invalid: "هذا الرابط غير صالح", invalidHelp: "أرسل ‎/upload إلى البوت للحصول على رابط جديد.", already: "أُضيفت سابقاً",
          until: "الرابط صالح حتى {t}", patient: "المريض", doctor: "الطبيب" },
    ckb: { title: "ئەپڵۆدکردنی فایل بۆ کەیس", pick: "دابگرە بۆ هەڵبژاردنی فایلەکان", hint: "یان ڕایانبکێشە ئێرە · سکان، zip، وێنە، ڤیدیۆ · هەر فایلێک تا {mb} MB",
           waiting: "چاوەڕوان…", uploading: "ئەپڵۆد دەکرێت {p}%", saving: "پاشەکەوت دەکرێت…", done: "زیاد کرا ✓", failed: "سەرنەکەوت", retry: "دووبارە هەوڵبدەرەوە",
           tooBig: "زۆر گەورەیە (تا {mb} MB)", expired: "ئەم بەستەرە بەسەرچووە", expiredHelp: "‎/upload بۆ بۆتەکە بنێرە بۆ وەرگرتنی بەستەرێکی نوێ.",
           invalid: "ئەم بەستەرە دروست نییە", invalidHelp: "‎/upload بۆ بۆتەکە بنێرە بۆ وەرگرتنی بەستەرێکی نوێ.", already: "پێشتر زیاد کراون",
           until: "بەستەرەکە تا {t} کار دەکات", patient: "نەخۆش", doctor: "پزیشک" },
    kmr: { title: "ئەپلۆدکرنا فایلان بۆ کەیسی", pick: "دابگرە بۆ هەلبژارتنا فایلان", hint: "یان بکێشە ڤێرە · سکان، zip، وێنە، ڤیدیۆ · هەر فایلەک هەتا {mb} MB",
           waiting: "چاڤەڕێ…", uploading: "ئەپلۆد دبیت {p}%", saving: "پاشەکەفت دبیت…", done: "هاتە زێدەکرن ✓", failed: "سەرنەکەفت", retry: "دووبارە هەول بدە",
           tooBig: "گەلەک مەزنە (هەتا {mb} MB)", expired: "دەمێ ڤی لینکی بسەرڤە چوو", expiredHelp: "‎/upload بۆ بۆتی بفرێکە بۆ وەرگرتنا لینکەکێ نوو.",
           invalid: "ئەڤ لینکە نە دروستە", invalidHelp: "‎/upload بۆ بۆتی بفرێکە بۆ وەرگرتنا لینکەکێ نوو.", already: "بەری نوکە هاتینە زێدەکرن",
           until: "لینک هەتا {t} کار دکەت", patient: "نەخۆش", doctor: "دکتۆر" },
    tr: { title: "Vakaya dosya yükle", pick: "Dosya seçmek için dokunun", hint: "veya buraya bırakın · taramalar, zip, fotoğraf, video · dosya başına {mb} MB'a kadar",
          waiting: "Bekliyor…", uploading: "Yükleniyor %{p}", saving: "Kaydediliyor…", done: "Eklendi ✓", failed: "Başarısız", retry: "Tekrar dene",
          tooBig: "Çok büyük (en fazla {mb} MB)", expired: "Bu bağlantının süresi doldu", expiredHelp: "Yeni bağlantı için bota /upload gönderin.",
          invalid: "Bu bağlantı geçerli değil", invalidHelp: "Yeni bağlantı için bota /upload gönderin.", already: "Daha önce eklenenler",
          until: "Bağlantı {t} saatine kadar geçerli", patient: "Hasta", doctor: "Hekim" }
  };
  var RTL = { ar: 1, ckb: 1, kmr: 1 };
  var token = (location.hash || "").replace(/^#/, "");
  var card = document.getElementById("card");
  var L = T.en, maxMb = 500;

  function fmt(s, vars) { return s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k]; }); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function call(body) {
    return fetch(FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ token: token }, body)) })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
  }
  function notice(title, help) {
    card.innerHTML = "";
    var n = el("div", "notice"); n.appendChild(el("b", null, title)); n.appendChild(el("span", null, help)); card.appendChild(n);
  }
  function setLang(code) {
    L = T[code] || T.en;
    document.documentElement.lang = code || "en";
    document.documentElement.dir = RTL[code] ? "rtl" : "ltr";
  }

  function render(info) {
    card.innerHTML = "";
    card.appendChild(el("div", "lab", info.lab_name));
    var c = info.case || {};
    card.appendChild(el("h1", null, L.title + " " + (c.label || "")));
    var bits = [c.type, c.patient ? L.patient + ": " + c.patient : null, c.doctor ? L.doctor + ": " + c.doctor : null].filter(Boolean);
    card.appendChild(el("div", "meta", bits.join(" · ")));
    var until = new Date(info.expires_at);
    card.appendChild(el("div", "meta", fmt(L.until, { t: until.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) })));

    var drop = el("label", "drop"); drop.tabIndex = 0;
    drop.appendChild(el("strong", null, L.pick));
    drop.appendChild(el("span", null, fmt(L.hint, { mb: maxMb })));
    var input = el("input"); input.type = "file"; input.multiple = true; input.id = "files";
    drop.appendChild(input);
    card.appendChild(drop);
    var list = el("ul"); card.appendChild(list);

    if (info.files && info.files.length) {
      var prev = el("div", "meta", L.already + ": " + info.files.map(function (f) { return f.name; }).join(", "));
      prev.style.marginTop = "12px"; card.appendChild(prev);
    }

    input.addEventListener("change", function () { addFiles(input.files, list); input.value = ""; });
    drop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
    ["dragenter", "dragover"].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
    drop.addEventListener("drop", function (e) { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files, list); });
  }

  var queue = Promise.resolve();
  function addFiles(files, list) {
    Array.prototype.forEach.call(files, function (file) {
      var li = el("li"); var row = el("div", "row");
      row.appendChild(el("span", "name", file.name));
      var st = el("span", "state", L.waiting); row.appendChild(st);
      var bar = el("div", "bar"); var fill = el("i"); bar.appendChild(fill);
      li.appendChild(row); li.appendChild(bar); list.appendChild(li);
      if (file.size > maxMb * 1024 * 1024) { st.textContent = fmt(L.tooBig, { mb: maxMb }); st.className = "state err"; return; }
      // One at a time: steadier on a weak connection.
      queue = queue.then(function () { return uploadOne(file, st, fill, li); });
    });
  }

  function uploadOne(file, st, fill, li) {
    return call({ action: "start", file_name: file.name, size: file.size, content_type: file.type || "application/octet-stream" })
      .then(function (r) {
        if (r.status !== 200) throw new Error((r.body && r.body.error) || "start failed");
        var s = r.body;
        return new Promise(function (resolve, reject) {
          var up = new tus.Upload(file, {
            endpoint: TUS,
            retryDelays: [0, 3000, 5000, 10000, 20000, 30000],
            headers: { "x-signature": s.signature, apikey: APIKEY },
            uploadDataDuringCreation: true,
            removeFingerprintOnSuccess: true,
            metadata: { bucketName: s.bucket, objectName: s.path, contentType: file.type || "application/octet-stream", cacheControl: "3600" },
            chunkSize: 6 * 1024 * 1024,
            onError: reject,
            onProgress: function (sent, total) {
              var p = Math.floor((sent / total) * 100);
              fill.style.width = p + "%"; st.textContent = fmt(L.uploading, { p: p });
            },
            onSuccess: function () { resolve(s.upload_id); }
          });
          up.findPreviousUploads().then(function (prev) { if (prev.length) up.resumeFromPreviousUpload(prev[0]); up.start(); });
        });
      })
      .then(function (uploadId) {
        st.textContent = L.saving;
        return call({ action: "finish", upload_id: uploadId });
      })
      .then(function (r) {
        if (r.status !== 200) throw new Error((r.body && r.body.error) || "finish failed");
        fill.style.width = "100%"; st.textContent = L.done; st.className = "state ok";
      })
      .catch(function (e) {
        console.error(e);
        st.textContent = L.failed; st.className = "state err";
        var b = el("button", "retry", L.retry); b.type = "button";
        b.addEventListener("click", function () { b.remove(); st.className = "state"; queue = queue.then(function () { return uploadOne(file, st, fill, li); }); });
        li.appendChild(b);
      });
  }

  if (!/^[0-9a-f]{48}$/.test(token)) { notice(T.en.invalid, T.en.invalidHelp); return; }
  call({ action: "info" }).then(function (r) {
    if (r.status === 410) { notice(L.expired, L.expiredHelp); return; }
    if (r.status !== 200) { notice(L.invalid, L.invalidHelp); return; }
    setLang(r.body.language); maxMb = r.body.max_mb || maxMb;
    render(r.body);
  }).catch(function () { notice(L.invalid, L.invalidHelp); });
})();
</script>
</body>
</html>
